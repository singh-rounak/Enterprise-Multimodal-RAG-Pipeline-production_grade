events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    upstream backend_service {
        server backend:8000;
    }

    upstream frontend_service {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        # Disable buffering for SSE token streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;

        # Route API requests to FastAPI backend
        location /api/ {
            proxy_pass http://backend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Server-Sent Events headers
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }

        # Route interactive docs
        location /docs {
            proxy_pass http://backend_service/docs;
        }

        location /openapi.json {
            proxy_pass http://backend_service/openapi.json;
        }

        # Route static web app requests to frontend container
        location / {
            proxy_pass http://frontend_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
